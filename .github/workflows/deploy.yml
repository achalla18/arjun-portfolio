name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for the official Pages deployment (OIDC identity token).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Base path:
      #  - repository variable BASE_PATH, if set (use "/" for a custom domain)
      #  - "/" for a user site repo named <user>.github.io
      #  - "/<repo>/" for any other (project) repository
      - name: Resolve base path
        id: base
        env:
          OVERRIDE: ${{ vars.BASE_PATH }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            BASE="$OVERRIDE"
          elif [[ "$REPO" == *.github.io ]]; then
            BASE="/"
          else
            BASE="/$REPO/"
          fi
          echo "Using base path: $BASE"
          echo "path=$BASE" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
