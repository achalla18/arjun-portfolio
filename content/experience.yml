    highlights:
      - value: 0.50 in
        text: RMSE on 5-minute-ahead predictions.
      - value: 1,100+
        text: Road-closure events analyzed; weather-related incidents doubled during Helene.

  - organization: American University
    unit: Department of Mathematics and Statistics
    role: Research Assistant
    dates: June 2025 – August 2025
    summary: >-
      Researched mean-variance portfolio optimization under Dr. Hamid Semiyari,
