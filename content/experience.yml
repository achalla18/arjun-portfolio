      1/30 members of founding cohort, Built independently in Palantir Foundry. Developed and deployed a flood prediction system for critical infrastructure, and built a geospatial intelligence platform integrating Maryland’s road networks, drainage systems, and hydrological data into a unified operational map for emergency response teams, partnered with the Maryland Department of Transportation on data access.



    highlights:
      - value: 20+ connected datasets
        text: Maintained through Foundry with lineage; Federal and state datasets combined into one view.

