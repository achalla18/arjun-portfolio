# ------------------------------------------------------------------
# Roles. "now" fills the Now section, "past" fills Past.
# Entries show in the order written. Move one from now to past by
# cutting and pasting it (keep the "- " and the indentation).
#
# Fields
#   organization   (required)  e.g. University of Maryland
#   role           (required)  e.g. Research Assistant
#   dates          (required)  e.g. May 2026 – Present
#   summary        (required)  2–3 sentences shown in the popup
#   unit           (optional)  lab or department, shown under the role
#   highlights     (optional)  up to 3 lines; "value" is an optional big number
#   note           (optional)  a short caveat shown at the bottom of the popup
# ------------------------------------------------------------------

now:
  - organization: Geovaro Intelligence
    role: Founder
    dates: Present
    summary: Independent development and research in spatial intelligence, predictive modeling, and software engineering.

  - organization: University of Maryland
    unit: Hanan Samet Lab
    role: Research Assistant
    dates: May 2026 – Present
    summary: >-
      Researching spatial pattern matching: how computers find groups of places
      that fit a pattern. I am building SPMBench, a framework that implements
      and benchmarks three published algorithms.
    highlights:
      - text: Showed that the structure of a query graph significantly affects spatial-query performance.
    note: Ongoing, unpublished research.

  - organization: Yale School of Public Health
    unit: Humanitarian Research Lab
    role: Project Collaborator
    dates: June 2026 – Present
    summary: >-
      Building a satellite radar pipeline that detects flooding across South
      Sudan, and a labeled dataset for classifying flood types.
    highlights:
      - value: 27.4% → 0.01%
        text: Missing satellite coverage after redesigning the baseline.
      - value: ~69%
        text: Pooled classification accuracy across 10 states.
    note: Coverage and accuracy are separate measures.

past:
  - organization: Palantir Technologies
    unit: Valley Forge Grant
    role: Valley Forge Grantee
    dates: June 2026 – September 2026
    summary: >-
      Awarded a $10,000 grant to build a flood prediction system for critical
      infrastructure. I built a Foundry platform that brings Maryland road,
      drainage, and hydrology data into one map for emergency workers, working
      with the Maryland Department of Transportation on data.
    highlights:
      - value: 8+
        text: Federal and state datasets combined into one queryable view.
    note: A grant-funded project, not employment at Palantir.

  - organization: MedStar-Georgetown Center for AI in Healthcare
    role: Lead Technical Intern
    dates: January 2026 – April 2026
    summary: >-
      Worked with Dr. Kolaleh Eskandanian to build a Python pipeline that
      collects, cleans, and links FDA medical device records from 2013 to 2023,
      and used AI classification to study what happens to devices after approval.
    highlights:
      - text: Produced a reproducible dataset and a technical report on device commercialization.

  - organization: North Carolina State University
    role: Machine Learning Intern
    dates: April 2025 – October 2025
    summary: >-
      Built short-term flood prediction models for Raleigh, NC from USGS, NOAA,
      and geospatial data, and studied road closures during Hurricane Helene.
    highlights:
      - value: 0.50 in
        text: RMSE on 5-minute-ahead predictions.
      - value: 1,100+
        text: Road-closure events analyzed; weather-related incidents doubled during Helene.
    note: RMSE is prediction error in inches, not road-closure accuracy.

  - organization: American University
    unit: Department of Mathematics and Statistics
    role: Research Assistant
    dates: June 2025 – August 2025
    summary: >-
      Researched mean-variance portfolio optimization under Dr. Hamid Semiyari,
      studying how allocations trade risk against return across market
      conditions from 2020 to 2023.
    highlights:
      - value: 1.92% → 0.91%
        text: Portfolio risk reduced in the historical analysis.
    note: Historical, in-sample results; not a guarantee of future performance.
