# ------------------------------------------------------------------
# Roles. "now" fills the Now section, "past" fills Past.
# Entries show in the order written. Move one from now to past by
# cutting and pasting it (keep the "- " and the indentation).
#
# Fields
#   organization   (required)  e.g. University of Maryland
#   role           (required)  e.g. Research Assistant
#   dates          (required)  e.g. May 2026 – Present
#   summary        (required)  2–3 sentences shown in the popup
#   unit           (optional)  lab or department, shown under the role
#   highlights     (optional)  up to 3 lines; "value" is an optional big number
#   note           (optional)  a short caveat shown at the bottom of the popup
# ------------------------------------------------------------------

now:
  - organization: Geovaro Intelligence
    role: Founder
    dates: November 2025 – Present
    summary: Independent development and research in spatial intelligence, predictive modeling, and software engineering. Currently working with Maryland state agencies to improve flood prediction and emergency response.

  - organization: University of Maryland
    unit: Hanan Samet Lab
    role: Research Assistant
    dates: May 2026 – Present
    summary: >-
      Currently working on spatial pattern matching: how computers find groups of places
      that fit a pattern. I am building SPMBench which is a framework that implements
      and benchmarks already published algorithms.
    highlights:
      - text: Showed that the structure of a query graph significantly affects spatial-query performance.
    note: Publication in progress; results pending peer review.

  - organization: Yale School of Public Health
    unit: Humanitarian Research Lab
    role: Project Collaborator
    dates: June 2026 – Present
    summary: >-
      Building a satellite radar pipeline that detects flooding across South
      Sudan, and a labeled dataset for classifying flood types.
    highlights:
      - value: 27.4% → 0.01%
        text: Missing satellite coverage after redesigning the data pipeline.
      - value: ~75%
        text: Flood classification accuracy across South Sudan.
    note: Currently working on implementing this to other regions in Africa.

past:
  - organization: Palantir Technologies
    unit: Valley Forge Grant
    role: Valley Forge Grantee
